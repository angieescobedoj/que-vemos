<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Companion · Celular</title>
<style>
@font-face{font-family:'Montserrat';font-weight:400;font-display:swap;src:url('../fonts/montserrat-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Montserrat';font-weight:600;font-display:swap;src:url('../fonts/montserrat-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Montserrat';font-weight:700;font-display:swap;src:url('../fonts/montserrat-latin-700-normal.woff2') format('woff2')}
:root{--bg:#000000;--card:#1E1E1E;--card-2:#333333;--ink:#FFFFFF;--ink-2:#BDC0C3;--ink-3:#BDC0C3;--line:#333333;
  --violet:#0071EB;--lilac:#0071EB;--pink:#0071EB;--red:#F35C5C;--green:#8AD27F}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,sans-serif;font-size:16px;line-height:24px;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input{font:inherit}
.wrap{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:16px 16px 92px}
.eyebrow{font-size:12px;line-height:20px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--lilac)}
h1{font-size:32px;line-height:36px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
h2{font-size:20px;line-height:28px;font-weight:700;letter-spacing:-.01em}
.muted{color:var(--ink-2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.btn{display:block;width:100%;background:var(--violet);color:#fff;font-weight:600;border-radius:14px;padding:14px;text-align:center}
.btn.ghost{background:var(--card-2)}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:14px;line-height:20px;border-radius:11px}
.field{width:100%;background:var(--card-2);border:1px solid var(--line);color:#fff;border-radius:14px;padding:14px 16px;font-size:16px;line-height:24px}
.field::placeholder{color:var(--ink-3)}

/* gate (sin códigos: el QR trae la sala) */
.gate{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:40px 10px}
.gate .logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--lilac),var(--violet));display:flex;align-items:center;justify-content:center;font-size:32px;line-height:36px;font-weight:700}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--card-2);border-top-color:var(--lilac);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* header */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dec{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:left;min-width:0}
.dec b{display:block;font-size:16px;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dec small{display:block;font-size:12px;line-height:20px;color:var(--ink-2)}
.dec i{margin-left:auto;font-style:normal;color:var(--ink-3)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(78,115,74,.25);flex:none}
.dot.off{background:var(--red);box-shadow:0 0 0 4px rgba(177,79,78,.25)}
.dot.sleep{background:#DFB63C;box-shadow:0 0 0 4px rgba(223,182,60,.25)}
.pwr{width:52px;height:52px;border-radius:50%;background:var(--red);color:#fff;font-size:20px;line-height:28px;font-weight:700;flex:none;display:flex;align-items:center;justify-content:center}
.pwr.sleep{background:var(--card-2);color:var(--green);border:1px solid var(--line)}
.fake-note{background:rgba(223,182,60,.14);border:1px solid rgba(223,182,60,.4);color:#DFB63C;border-radius:14px;padding:10px 12px;font-size:12px;line-height:20px;margin-bottom:12px}

/* control */
.search{display:flex;gap:8px;margin-bottom:18px}
.pad{position:relative;width:250px;height:250px;margin:12px auto 16px;border-radius:50%;background:var(--card);border:1px solid var(--line)}
.pad button{position:absolute;width:80px;height:80px;display:flex;align-items:center;justify-content:center;font-size:32px;line-height:36px;color:var(--ink-2);border-radius:50%;font-weight:700}
.pad button:active{background:var(--card-2);color:#fff}
.pad .u{left:85px;top:0}.pad .d{left:85px;bottom:0}.pad .l{left:0;top:85px}.pad .r{right:0;top:85px}
.pad .ok{left:75px;top:75px;width:100px;height:100px;background:var(--violet);color:#fff;font-size:16px;line-height:24px;font-weight:600}
.pad .ok:active{background:#006ADB}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.keys3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.row2 button,.vol button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 6px;font-size:14px;line-height:20px;font-weight:600}
.row2 button:active,.vol button:active,.apps button:active{transform:scale(.97)}
.vol{display:grid;grid-template-columns:1fr 1fr 1.1fr 1fr;gap:10px;align-items:center;margin-bottom:6px}
.vol button{padding:11px 6px;color:#fff;display:flex;align-items:center;justify-content:center}
.vol span{text-align:center;font-size:14px;line-height:20px;font-weight:600;color:var(--ink-2)}
.vol button.on{background:var(--red);border-color:var(--red);color:#fff}
.keys3 svg,.vol svg{width:24px;height:24px;display:block;color:#fff}
#playBtn .i-pause{display:none}
#playBtn.playing .i-play{display:none}
#playBtn.playing .i-pause{display:inline}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.apps button{aspect-ratio:1/1;border-radius:14px;position:relative;overflow:hidden;background:var(--c,#141414);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;padding:4px;font-size:12px;line-height:20px;font-weight:600;line-height:1.15;text-align:center}
.apps button img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.apps button.has-logo{background:#000}
.apps button.has-logo .nm{visibility:hidden}
.sec-c{font-size:12px;line-height:20px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 8px}
.keys3 button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 6px;font-size:12px;line-height:20px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}
.keys3 button:active{background:var(--card-2)}

/* ahora */
.sec{margin-top:18px}
.sec-h{font-size:12px;line-height:20px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .av{width:40px;height:40px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--lilac),var(--violet));display:flex;align-items:center;justify-content:center;font-weight:600}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600}
.item .s{font-size:12px;line-height:20px;color:var(--ink-2)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin:12px 0}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:14px;line-height:20px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--violet);color:#fff}
.lineup{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lineup .team{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.lineup .tn{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px}
.lineup .sw{width:12px;height:12px;border-radius:3px}
.lineup .pl{display:flex;gap:8px;font-size:12px;line-height:20px;padding:3px 0}
.lineup .pl b{width:20px;color:var(--lilac)}
.lineup .pl span{flex:1}
.lineup .pl em{font-style:normal;color:var(--ink-3);font-size:10px;line-height:15px}
.stat{margin:12px 0}
.stat .row{display:flex;justify-content:space-between;font-size:14px;line-height:20px;font-weight:600;margin-bottom:6px}
.stat .bars{display:flex;gap:4px;height:8px}
.stat .bars i{display:block;border-radius:4px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px;font-size:14px;line-height:20px}
.empty{text-align:center;padding:30px 10px}
.empty p{margin:8px 0 18px}
.stack{display:flex;flex-direction:column;gap:10px}

/* banner */
.banner{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));max-width:436px;margin:0 auto;background:#fff;color:#333333;border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center;z-index:30;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.banner .ic{width:42px;height:42px;border-radius:12px;background:var(--violet);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:28px;flex:none;font-weight:700}
.banner .k{font-size:10px;line-height:15px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--violet)}
.banner .t{font-weight:600;font-size:14px;line-height:20px}
.banner .s{font-size:12px;line-height:20px;color:#68686A}
.banner .x{margin-left:auto;display:flex;flex-direction:column;gap:6px}
.banner .x button{font-size:12px;line-height:20px;font-weight:600;border-radius:10px;padding:7px 10px;background:var(--violet);color:#fff}
.banner .x button.g{background:#E5F2FF;color:var(--violet)}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;color:#333333;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));z-index:40;max-width:460px;margin:0 auto;box-shadow:0 -12px 40px rgba(0,0,0,.4)}
.sheet .img{height:140px;border-radius:16px;background:linear-gradient(135deg,#0071EB,#006ADB);margin-bottom:14px}
.sheet h2{margin-bottom:4px}
.sheet .sub{color:#68686A;font-size:14px;line-height:20px;margin-bottom:14px}
.sheet .btn.ghost{background:#E5F2FF;color:var(--violet)}
.sheet{max-height:86vh;overflow:auto}
/* hoja oscura (datos del partido al pausar) */
.sheet.dark{background:#1E1E1E;color:#fff;border-top:1px solid rgba(0,113,235,.25)}
.sheet.dark .x{background:rgba(255,255,255,.08);color:#fff}
.sheet.dark .btn.ghost{background:rgba(0,113,235,.2);color:#E5F2FF}
.mfact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px;font-size:14px;line-height:20px}
.mreplay{display:flex;align-items:center;gap:10px;margin-top:16px;background:rgba(255,255,255,.05);border:1px solid rgba(0,113,235,.22);border-radius:14px;padding:12px}
.mreplay .btn{white-space:nowrap;flex:none;width:auto;padding:10px 14px}
.mreplay .t{font-size:14px;line-height:20px;font-weight:600}.mreplay .s{font-size:12px;line-height:20px;color:var(--ink-2);margin-top:2px}
.sheet .x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;background:#E5F2FF;color:#68686A;font-size:16px;line-height:24px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:14px;border:1px solid #E8E8F2;margin-bottom:8px;background:#fff;color:#333333}
.opt.on{border-color:var(--violet);background:#E5F2FF}
.opt .ic{width:40px;height:40px;border-radius:12px;background:#E5F2FF;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:28px;flex:none;font-weight:700}
.opt .grow{flex:1;min-width:0}
.opt .t{font-weight:600}
.opt .s{font-size:12px;line-height:20px;color:#68686A}
.opt .tag{font-size:10px;line-height:15px;font-weight:600;color:#836A20;background:#FFFAEC;border-radius:6px;padding:2px 6px;margin-left:6px}
.opt .del{color:#BDC0C3;font-size:14px;line-height:20px;padding:6px}
.sdot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--green)}
.sdot.sleep{background:#DFB63C}.sdot.off{background:#BBB}
.lf{display:block;font-size:12px;line-height:20px;font-weight:600;color:#68686A;margin:12px 0 6px}
.lf input[type=range]{width:100%;accent-color:var(--violet)}
.in-l{width:100%;border:1px solid #E8E8F2;border-radius:12px;padding:12px 14px;font-size:16px;line-height:24px;color:#333333;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chips button{background:#E5F2FF;color:#006ADB;font-size:14px;line-height:20px;font-weight:600;border-radius:999px;padding:8px 12px}
.chips button.on{background:var(--violet);color:#fff}
.vform{display:flex;gap:8px}
.vform button{background:var(--violet);color:#fff;font-weight:600;border-radius:12px;padding:0 16px}
.scrim{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:35}

/* gamepad */
.game{position:fixed;left:0;top:0;right:0;bottom:0;background:var(--bg);z-index:25;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none}
.game .gh{display:flex;justify-content:space-between;align-items:center}
.game .me{display:flex;align-items:center;gap:10px;font-weight:600}
.game .me .av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.game .pts{font-size:32px;line-height:36px;font-weight:700}
.game .gr{display:flex;align-items:center;gap:14px}
.game .gx{width:44px;height:44px;border-radius:50%;background:var(--card-2);border:1px solid var(--line);font-size:20px;line-height:28px;color:#fff;font-weight:700}
.game .gb{flex:1;display:flex;gap:14px;margin-top:16px}
.game .gb button{flex:1;border-radius:28px;background:var(--card);border:1px solid var(--line);font-size:56px;color:var(--lilac);touch-action:none}
.game .gb button.on{background:var(--violet);color:#fff}
.game .hint{text-align:center;font-size:12px;line-height:20px;color:var(--ink-3);margin-top:10px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#fff;color:#333333;font-weight:600;font-size:14px;line-height:20px;padding:10px 16px;border-radius:12px;z-index:45;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.3)}
/* Feedback al presionar, igual en iPhone y Android: iOS no pinta :active por sí solo, así que phone.js pone .pressed
   en cuanto el dedo toca el botón y lo deja al menos 140 ms para que se alcance a ver aunque el toque sea rapidísimo. */
button{transition:background-color .08s,transform .08s,filter .08s}
button.pressed{transform:scale(.95);filter:brightness(1.4)}
.row2 button.pressed,.keys3 button.pressed,.vol button.pressed,.apps button.pressed,.dec.pressed,.tab.pressed{background:#3E4758;border-color:rgba(0,113,235,.7);filter:none}
.pad button.pressed{background:var(--card-2);color:#fff;filter:none;transform:none}
.pad .ok.pressed{background:#006ADB;transform:scale(.96)}
.sheet button.pressed,.banner button.pressed{filter:brightness(.88)}
.sheet:not([hidden]) ~ .toast{bottom:auto;top:calc(14px + env(safe-area-inset-top))}
/* sugerencia al pausar (banner con póster) */
.banner.offer{flex-wrap:wrap;align-items:flex-start}
.banner.offer .poster{width:54px;height:80px;border-radius:10px;flex:none;background:#EEE center/cover no-repeat}
.banner.offer .grow{flex:1;min-width:0}
.banner.offer .t{font-size:16px;line-height:24px;line-height:1.25;margin:2px 0}
.banner.offer .row{display:flex;gap:8px;width:100%}
.banner.offer .row button{flex:1;font-size:14px;line-height:20px;font-weight:600;border-radius:12px;padding:11px 8px;background:var(--violet);color:#fff}
.banner.offer .row button.g{flex:0 0 auto;background:#E5F2FF;color:var(--violet)}
/* datos curiosos */
.fact{position:relative;background:#E5F2FF;border-radius:16px;padding:18px 16px 18px;font-size:16px;line-height:24px;font-weight:600;line-height:1.4;color:#333333;min-height:120px}
.fact .fn{display:block;font-size:12px;line-height:20px;font-weight:600;letter-spacing:.1em;color:#006ADB;margin-bottom:6px}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0 4px}
.dots i{width:8px;height:8px;border-radius:50%;background:#E8E8F2}.dots i.on{background:#006ADB}
/* control clásico */
.pad2{position:fixed;left:0;top:0;right:0;bottom:0;z-index:38;background:#141414;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.p2-in{position:absolute;left:0;top:0;width:100vw;height:100vh;display:flex;flex-direction:column;padding:10px max(22px,env(safe-area-inset-right)) 10px max(22px,env(safe-area-inset-left));transform-origin:top left;box-sizing:border-box}
.p2-in.rot{padding:12px 30px 12px 54px}
.p2-top{display:flex;align-items:center;gap:12px}
.p2-top .me{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;line-height:20px}
.p2-top .av{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;line-height:20px;font-weight:600}
.p2-info{flex:1;text-align:center;font-size:14px;line-height:20px;color:var(--ink-2)}
.p2-pts{font-size:20px;line-height:28px;font-weight:700;min-width:36px;text-align:right}
.p2-x{width:36px;height:36px;border-radius:50%;background:var(--card-2);border:1px solid var(--line);color:#fff}
.p2-body{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:0}
.dpad{position:relative;width:min(42vmin,180px);height:min(42vmin,180px);flex:none}
.dpad button,.dpad .dc{position:absolute;width:34%;height:34%;background:#333333;border:1px solid #3E4758;color:#0071EB;font-size:20px;line-height:28px;display:flex;align-items:center;justify-content:center;font-weight:700}
.dpad .du{left:33%;top:0;border-radius:12px 12px 0 0}.dpad .dd{left:33%;bottom:0;border-radius:0 0 12px 12px}
.dpad .dl{left:0;top:33%;border-radius:12px 0 0 12px}.dpad .dr{right:0;top:33%;border-radius:0 12px 12px 0}
.dpad .dc{left:33%;top:33%;border:0}
.dpad button.on{background:#006ADB;color:#fff}
.p2-mid{display:flex;flex-direction:column;align-items:center;gap:14px}
.p2-logo{font-size:12px;line-height:20px;font-weight:600;letter-spacing:.2em;text-align:center;color:var(--ink-3)}
.pill{background:#333333;border:1px solid #3E4758;color:#0071EB;font-size:12px;line-height:20px;font-weight:600;letter-spacing:.14em;border-radius:999px;padding:8px 18px}
.pill.on{background:#006ADB;color:#fff}
.ab{position:relative;width:min(44vmin,190px);height:min(38vmin,160px);flex:none}
.ab button{position:absolute;width:46%;height:54%;border-radius:50%;font-size:32px;line-height:36px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ab small{font-size:10px;line-height:15px;font-weight:600;letter-spacing:.06em;margin-top:3px;opacity:.85}
.ab .ba{right:0;top:0;background:#B14F4E;color:#fff}
.ab .bb{left:0;bottom:0;background:#DFB63C;color:#333333}
.ab button.on{transform:scale(.92);filter:brightness(1.25)}
.p2-over{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;gap:12px;padding:0 20%}
.p2-over .btn{flex:1}
.qty{display:flex;align-items:center;gap:8px;flex:none}
.qty button{width:32px;height:32px;border-radius:10px;background:#E5F2FF;color:#006ADB;font-size:20px;line-height:28px;font-weight:700}
.qty b{min-width:14px;text-align:center}
.chipb{flex:none;background:#E5F2FF;color:#006ADB;font-size:12px;line-height:20px;font-weight:600;border-radius:999px;padding:8px 12px}
.chipb.on{background:var(--violet);color:#fff}
.pairb{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.banner .x a.lk{font-size:12px;line-height:20px;font-weight:600;border-radius:10px;padding:7px 10px;background:#333333;color:#fff;text-align:center;text-decoration:none}
.card a.btn.sm{text-decoration:none;margin-right:6px}
.songbtns{display:flex;gap:8px;padding:0 0 12px}

/* ---------- v7.6 · control con estilo neón (referencia) ---------- */
body{background:#000000}

  box-shadow:0 0 24px rgba(0,113,235,.45),inset 0 0 28px rgba(0,113,235,.35)}

.keys3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:0 6px 12px}

.keys3.vol{margin-bottom:4px}
.vol button.on{background:rgba(177,79,78,.35);border-color:#F35C5C}
/* apps + voz: siempre abajo, sobre las pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(0,0,0,.96);border-top:1px solid rgba(255,255,255,.07);padding-bottom:env(safe-area-inset-bottom)}
/* apps fijas */

.gl.pressed{background:rgba(0,113,235,.3);border-color:#0071EB;filter:none}

/* v7.10 · mini control fuera de la pestaña Control */
.mini{max-width:460px;margin:0 auto;display:grid;grid-template-columns:1fr 64px 1fr;gap:10px;padding:10px 16px 2px}

.wrap{min-height:100vh;min-height:100dvh}

/* ---------- v7.19 · encabezado, decodificadores y configuración ---------- */
.top .cfg{justify-self:start}
.top .pwr{justify-self:end}

.dcard{margin-top:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);overflow:hidden}

.btn.warn{background:var(--red)}

.radio.on .rd{border-color:#0071EB;box-shadow:inset 0 0 0 5px #0071EB}
.fav-list{display:flex;flex-direction:column;gap:8px}

.fav-ic img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain}
.fav-row .grow{flex:1;min-width:0;font-weight:600;font-size:14px;line-height:20px}
.fav-row button{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.08);color:inherit;font-size:16px;line-height:24px;font-weight:600}

/* v7.20 · fila de decodificador: nombre + lápiz + estrella, estado abajo, CTA a la derecha */
.dcard{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px}

/* v7.35 · partido en tres momentos */
.seg.mseg{overflow-x:auto;scrollbar-width:none}.seg.mseg::-webkit-scrollbar{display:none}
.seg.mseg button{flex:1 0 auto;padding:9px 8px;font-size:12px;line-height:20px;white-space:nowrap}

.mrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line);color:inherit}
.mrow .t{font-size:14px;line-height:20px;font-weight:600}.mrow .t em{font-style:normal;font-size:12px;line-height:20px;color:var(--ink-3);margin-left:4px}
.mrow .s{font-size:12px;line-height:20px;color:var(--ink-2);margin-top:2px}
.mrow .inj{width:32px;height:32px;border-radius:50%;flex:none;background:rgba(177,79,78,.18);color:#F35C5C;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:20px}
.mrow .pm{width:40px;flex:none;font-weight:600;color:var(--lilac)}
.mrow .pi{flex:none;font-size:12px;line-height:20px;font-weight:600;color:var(--lilac);background:rgba(0,113,235,.16);border-radius:999px;padding:6px 12px}

.h2h{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:4px}
.h2h div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.h2h b{display:block;font-size:32px;line-height:36px;font-weight:700}.h2h span{font-size:12px;line-height:20px;color:var(--ink-2)}
.mtable{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 12px}
.mtable>div{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:14px;line-height:20px;border-bottom:1px solid var(--line)}
.mtable>div:last-child{border-bottom:0}
.mtable>div>span:first-child{width:18px;color:var(--ink-3);font-weight:600}
.mtable>div>span:not(:first-child):not(.grow),.mtable>div>b{width:32px;text-align:right}
.mtable .mt-h{font-size:12px;line-height:20px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.mtable .mt-r.hl{font-weight:600;box-shadow:inset 3px 0 0 var(--tc);margin-left:-12px;padding-left:9px}
.mtable em{font-style:normal;font-size:12px;line-height:20px;font-weight:600;margin-left:4px}.mtable em.up{color:#8AD27F}.mtable em.dn{color:#F35C5C}
.rp{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/9;background:#0B2A16}
.rp-pitch{display:block;width:100%;height:100%}
.rp-cam{position:absolute;inset:0;background-size:cover;background-position:center;animation:rpz 5s ease-in-out infinite}
.rp-cam.a1{transform-origin:70% 60%}.rp-cam.a2{transform-origin:30% 40%;animation-name:rpz2}
@keyframes rpz{0%{transform:scale(1.05)}100%{transform:scale(1.6)}}
@keyframes rpz2{0%{transform:scale(1.3) translateX(6%)}100%{transform:scale(1.5) translateX(-8%)}}
.rp-tag{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;line-height:15px;font-weight:600;letter-spacing:.08em;padding:5px 8px;border-radius:6px}
.rp-bar{position:absolute;left:10px;right:10px;bottom:10px;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.rp-bar i{display:block;height:100%;background:#fff;animation:rpb 5s linear infinite}
@keyframes rpb{from{width:0}to{width:100%}}
.rp-angs{margin:10px 0 0}
.sheet.dark .chips button.on{background:var(--violet);color:#fff}
.rp-desc{font-size:14px;line-height:20px;color:var(--ink-2);margin-top:8px}
.scorer{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}

.tiles b{display:block;font-size:20px;line-height:28px;font-weight:700}.tiles span{font-size:12px;line-height:20px;color:var(--ink-2)}
.heat{display:block;width:100%;border-radius:16px}
.mseg2{background:rgba(255,255,255,.06)}.sheet.dark .mseg2 button{color:var(--ink-2)}.sheet.dark .mseg2 button.on{background:var(--violet);color:#fff}
.mrow.vote{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.pollr{position:relative;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;overflow:hidden;font-size:14px;line-height:20px;font-weight:600}
.pollr i{position:absolute;left:0;top:0;bottom:0;background:rgba(0,113,235,.22);z-index:0}
.pollr span,.pollr b{position:relative}.pollr.me{border-color:var(--violet)}.pollr.me i{background:rgba(0,113,235,.42)}

body.light .scorer .nth{color:#836A20}
body.light .mseg2{background:#E5F2FF}
.sheet>.eyebrow:first-of-type{padding-right:40px}

/* v7.36 · hojas de deportes en claro, como las de películas */
.sheet.sport{--card:#FAFAFC;--card-2:#F3F2F8;--ink:#333333;--ink-2:#68686A;--ink-3:#68686A;--line:#E8E8F2;--lilac:#006ADB;--violet:#006ADB;--red:#B14F4E;--green:#4E734A}
.sheet.sport .mreplay{background:#F3F2F8;border-color:rgba(0,106,219,.22)}
.sheet.sport .mseg2{background:#E5F2FF}.sheet.sport .mseg2 button{color:#68686A}.sheet.sport .mseg2 button.on{background:var(--violet);color:#fff;box-shadow:none}
.sheet.sport .scorer .nth{background:#FFFAEC;color:#836A20}
.sheet.sport .mrow .inj{background:#FDF2F2;color:#B14F4E}
.sheet.sport .mrow .pi{background:#E5F2FF;color:var(--violet)}
.sheet.sport .mtable em.up{color:#4E734A}
.sheet.sport .pollr i{background:rgba(0,106,219,.12)}.sheet.sport .pollr.me i{background:rgba(0,106,219,.24)}

/* v7.37 · receta al iniciar y al terminar */
.rc-img{height:140px;border-radius:16px;background:#3E7A3A center/cover;margin-bottom:14px}
.rc-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.rc-facts div{background:#F3F2F8;border:1px solid #E8E8F2;border-radius:14px;padding:10px 6px;text-align:center}
.rc-facts span{display:block;font-size:20px;line-height:28px;font-weight:700}.rc-facts b{display:block;font-size:14px;line-height:20px;margin-top:2px}.rc-facts small{font-size:12px;line-height:20px;color:#68686A}
.rc-ings>div{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #E8E8F2;font-size:14px;line-height:20px}
.rc-ings .ic{width:34px;height:34px;border-radius:10px;background:#E5F2FF;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:24px;flex:none}
.rc-ings .grow{flex:1}.rc-ings b{font-size:14px;line-height:20px;color:#68686A;font-weight:600}
.rc-step{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #E8E8F2}
.rc-step .n{width:28px;height:28px;border-radius:50%;background:var(--violet);color:#fff;font-weight:600;font-size:14px;line-height:20px;display:flex;align-items:center;justify-content:center;flex:none}
.rc-step .grow{flex:1}.rc-step .t{font-weight:600;font-size:14px;line-height:20px}.rc-step .s{font-size:14px;line-height:20px;color:#68686A;margin-top:2px}

/* v7.38 · menú de tres puntos del soundtrack (apps de música) */
.opt .dots{flex:none;width:40px;height:40px;border-radius:50%;font-size:20px;line-height:28px;line-height:1;color:#006ADB;background:#E5F2FF;display:flex;align-items:center;justify-content:center;font-weight:700}
#actMenu{position:fixed;inset:0;z-index:60}
#actMenu[hidden]{display:none}
.am-back{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.am-panel{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));max-width:444px;margin:0 auto;background:#fff;color:#333333;border-radius:24px;padding:16px;animation:amUp .2s ease-out}
@keyframes amUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.am-song{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid #E8E8F2}
.am-song .ic{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#0071EB,#006ADB);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:28px;flex:none;font-weight:700}
.am-song .grow,.am-row .grow{flex:1;min-width:0}.am-song .t{font-weight:600;font-size:16px;line-height:24px}.am-song .s{font-size:14px;line-height:20px;color:#68686A}
.am-h{font-size:12px;line-height:20px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#006ADB;margin:14px 0 4px}
.am-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0;font-size:16px;line-height:24px;font-weight:600;color:#333333}
.am-row small{display:block;font-size:12px;line-height:20px;font-weight:600;color:#006ADB}
.am-ic{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:16px;line-height:24px}
.am-ic.sv{background:#E5F2FF;color:var(--violet);font-size:20px;line-height:28px;font-weight:700}
.am-go{color:#BDC0C3;font-size:16px;line-height:24px}
.am-cancel{display:block;width:100%;margin-top:8px;padding:14px;border-radius:14px;background:#E5F2FF;color:#006ADB;font-weight:600;font-size:16px;line-height:24px}

/* ---------- v7.41 · Mobile Grid del DS: 4 columnas fluidas (76 px a 360), márgenes 16, gutter 8, header 52 ---------- */
.wrap{padding-left:16px;padding-right:16px;padding-top:env(safe-area-inset-top)}
.top,.navrow3,#appsRow,.keypad .keys3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))!important;column-gap:8px;width:100%;max-width:none;margin-left:0;margin-right:0}
/* header 52 px: nombre del decodificador en las 2 columnas centrales, apagar en la 4.ª */
.top{height:52px;margin-bottom:8px;align-items:center}
.top .top-sp{grid-column:1}
.top .dec{grid-column:2/4;justify-self:center}
.top .pwr{grid-column:4;justify-self:end;width:48px;height:48px}
.top .pwr svg{width:24px;height:24px}
/* Regresar (col 1) · Inicio (cols 2-3) · Configuración (col 4) */
.navrow3 .navc:nth-child(1){grid-column:1}
.navrow3 .navc:nth-child(2){grid-column:2/4}
.navrow3 .navc:nth-child(3){grid-column:4}
/* apps favoritas: 1 columna cada una, cuadradas */
#appsRow{gap:8px}
#appsRow button{width:100%;height:auto;aspect-ratio:1/1;max-width:none}
/* reproducción: ⏪ col 1 · ▶︎ cols 2-3 · ⏩ col 4 / volumen: – col 1 · silencio cols 2-3 · + col 4 */
.keypad .keys3{gap:0 8px}
.keypad .keys3 button{width:100%;grid-row:1}
.keypad .keys3:not(.vol) button:nth-child(1){grid-column:1}
.keypad .keys3:not(.vol) button:nth-child(2){grid-column:2/4}
.keypad .keys3:not(.vol) button:nth-child(3){grid-column:4}
.keypad .keys3.vol [data-vol="-5"]{grid-column:1}
.keypad .keys3.vol #muteBtn{grid-column:2/4}
.keypad .keys3.vol [data-vol="5"]{grid-column:4}
/* pantallas de Decodificadores / Configuración: barra de 52 px */
.dv-bar{height:52px}
/* hojas y avisos con los mismos márgenes de 16 px */
.sheet{padding-left:16px;padding-right:16px}
.mv-cast,.mv-recs{margin:0 -16px;padding:0 16px 4px}
.banner{left:16px;right:16px}

/* ---------- v7.42 · Espaciados App del DS: space-1 4 · space-2 8 · space-3 16 · space-4 32 ---------- */
:root{--s1:4px;--s2:8px;--s3:16px;--s4:32px}
/* pantalla: margen 16, header → body 16, body → bottom 32 */
.wrap{padding:env(safe-area-inset-top) var(--s3) calc(var(--s4) + env(safe-area-inset-bottom))}
.top{margin-bottom:var(--s3)}
#main > [data-tab="control"]:not([hidden]){gap:var(--s3);padding-top:0}
/* control: filas de teclas a 8, apps → teclas 16 (bloques distintos) */
.keypad{gap:var(--s2)}
.keypad #appsRow{margin-bottom:var(--s2)}
.navc{gap:var(--s2)}
/* Decodificadores / Configuración: título → texto 16, cards separadas 8, padding 16, textos dentro a 4 */
.dv-bar{margin-bottom:var(--s3)}
.dv-hint{margin-bottom:var(--s3)}
.dcard{margin-top:0;margin-bottom:var(--s2);padding:var(--s3);gap:var(--s2)}
.dinfo .s{margin-top:var(--s1);gap:var(--s1)}
.dv-scan{margin-top:var(--s3);padding:var(--s3)}
.cfg-list{gap:var(--s2)}
.set-row{padding:var(--s3);gap:var(--s3)}
.set-row .s{margin-top:var(--s1)}
#cfgView .set-link,#cfgView .lf{margin-top:var(--s3)}
.fav-row{padding:var(--s2);gap:var(--s2)}
.fav-foot{padding:0 var(--s3) env(safe-area-inset-bottom)}
#cfgView .fav-list{display:flex;flex-direction:column;gap:var(--s2)}
#cfgView .fav-list .fav-row{margin:0}
/* hojas: padding 16, 32 hasta abajo; textos del encabezado a 4, título → contenido 16, entre secciones 16, elementos de lista 8 */
.sheet{padding:var(--s3) var(--s3) calc(var(--s4) + env(safe-area-inset-bottom))}
.sheet h2{margin-bottom:var(--s1)}
.sheet .sub{margin-bottom:var(--s3)}
.mv-head{gap:var(--s3);margin-bottom:var(--s3)}
.mv-head h2{margin:var(--s1) 0}
.lf{margin:var(--s3) 0 var(--s2)}
.sheet .sec-h{margin:var(--s3) 0 var(--s2)}
.opt{padding:var(--s2) var(--s3);gap:var(--s2);margin-bottom:var(--s2)}
.opt .s,.mv-list .opt .s{margin-top:var(--s1)}
.mv-list,.cfg-list{gap:var(--s2)}
.mrow{padding:var(--s2) 0;gap:var(--s2)}
.mrow .s{margin-top:var(--s1)}
.rc-ings>div{padding:var(--s2) 0;gap:var(--s2)}
.rc-step{padding:var(--s2) 0;gap:var(--s2)}
.rc-facts{gap:var(--s2);margin:var(--s3) 0 0}
.scorer,.promo{padding:var(--s3);gap:var(--s2)}
.promo{margin-bottom:var(--s2)}
.tiles,.h2h{gap:var(--s2)}
.sheet .btn{margin-top:var(--s3)}
.am-panel{left:var(--s2);right:var(--s2);bottom:calc(var(--s2) + env(safe-area-inset-bottom));padding:var(--s3)}
.am-row{padding:var(--s2) 0;gap:var(--s2)}
.am-cancel{margin-top:var(--s2)}

/* ---------- v7.43 · Tipografía del DS (Montserrat): display 32/36 · heading-1 20/28 · heading-2 16/24 · heading-3 14/20 · body-1 14/20 · body-2 12/20 · caption 10/15 ---------- */
:root{--tracking-sm:-0.01em}
body{font-size:14px;line-height:20px;font-weight:500}
h1{font-size:32px;line-height:36px;font-weight:700;letter-spacing:var(--tracking-sm)}
h2,.sheet h2,.mv-head h2{font-size:20px;line-height:28px;font-weight:700;letter-spacing:var(--tracking-sm)}
.dv-title,.dname,.set-row .t,.scorer .t,.am-song .t,.top .dec b{font-size:16px;line-height:24px;font-weight:600;letter-spacing:var(--tracking-sm)}
.lf,.sec-h,.sec-c,.sheet .sec-h,.am-h,.mv-facts span,.mtable .mt-h,.banner .k,.fact .fn{font-size:14px;line-height:20px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink)}
.sheet .lf,.sheet .sec-h,.sheet .am-h,.am-h,.sheet .mv-facts span{color:#333333}
.sheet.sport .sec-h{color:var(--ink)}
.mtable .mt-h{font-size:10px;line-height:15px;color:var(--ink-2)}
.eyebrow{font-size:12px;line-height:20px;font-weight:600;letter-spacing:0;text-transform:none}
.sheet .sub,.opt .s,.mrow .s,.set-row .s,.dinfo .s,.promo .s,.scorer .s,.am-song .s,.rc-step .s,.navc .lbl{font-size:12px;line-height:20px}
.opt .t,.mrow .t,.promo .t,.rc-step .t,.am-row,.btn{font-size:14px;line-height:20px;font-weight:600}
.rp-tag{font-size:10px;line-height:15px}

/* ---------- v7.45 · Elevaciones del DS (medidas de los PDF Elevation Light / Dark) ----------
   100: pertenece al fondo (cards de listas) · 200: contrasta con 100 (botones del control, apps)
   300: flotante que informa (avisos, toast, barra fija) · 400: encima de todo, interrumpe (bottom sheets, menú de música) */
:root{--e100:0 1px 3px rgba(0,0,0,.40);--e200:0 2px 8px rgba(0,0,0,.45);--e300:0 4px 14px rgba(0,0,0,.50);--e400:0 8px 24px rgba(0,0,0,.55);--e400-up:0 -8px 24px rgba(0,0,0,.55)}
body.light{--e100:0 1px 3px rgba(0,0,0,.06);--e200:0 2px 6px rgba(0,0,0,.08);--e300:0 4px 12px rgba(0,0,0,.14);--e400:0 8px 20px rgba(0,0,0,.20);--e400-up:0 -8px 20px rgba(0,0,0,.20)}
/* las hojas son superficies claras: dentro de ellas se usan las elevaciones light */
.sheet:not(.dark),.am-panel{--e100:0 1px 3px rgba(0,0,0,.06);--e200:0 2px 6px rgba(0,0,0,.08);--e300:0 4px 12px rgba(0,0,0,.14)}
/* 100 */
.dcard,.set-row,.fav-row,.opt,.lineup .team,.mtable,.scorer,.promo,.h2h div,.tiles div,.rc-facts div,.mreplay,.mrow.vote,.pollr,body.light .gl{box-shadow:var(--e100)}
.dcard.cur{box-shadow:var(--e100),0 0 0 1px #0071EB}
/* 200 */
.gl,body.light .gl,.navc .circ,#appsRow button,.keypad .keys3 button,.seg2 button.on{box-shadow:var(--e200)}
/* 300 */
.toast,.banner,.fav-foot{box-shadow:var(--e300)}
/* 400 */
.sheet{box-shadow:var(--e400-up)}
.am-panel{box-shadow:var(--e400)}
.am-ic{position:relative;overflow:hidden}
.am-ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
.am-ic.has{background:#fff!important;box-shadow:inset 0 0 0 1px #E8E8F2}.am-ic.has img{opacity:1}.am-ic.has b{display:none}

/* v7.47 · "Está sonando" en vivo en la ficha de la película */
.mv-now{display:flex;align-items:center;gap:var(--s2,8px);padding:var(--s2,8px) var(--s2,8px) var(--s2,8px) var(--s3,16px);margin:0 0 var(--s3,16px);border-radius:14px;background:#E5F2FF;color:#333;animation:mvNowIn .35s ease-out}
.mv-now .grow{min-width:0;flex:1}
.mv-now .k{display:block;font-size:12px;line-height:16px;font-weight:600;color:#006ADB}
.mv-now .t{display:block;font-size:14px;line-height:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-now .s{display:block;font-size:12px;line-height:16px;color:#68686A}
.mv-now .dots{flex:none;width:40px;height:40px;border-radius:50%;font-size:20px;line-height:1;color:#006ADB;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;margin:0}
.mv-now .eq{flex:none;width:24px;height:20px;display:flex;align-items:flex-end;gap:3px}
.mv-now .eq i{width:5px;border-radius:2px;background:#006ADB;height:30%}
.mv-now.on .eq i{animation:mvEq .9s ease-in-out infinite}
.mv-now.on .eq i:nth-child(2){animation-delay:-.3s}.mv-now.on .eq i:nth-child(3){animation-delay:-.6s}
.mv-now.after{background:#F4F4F8}.mv-now.after .k{color:#68686A}.mv-now.after .eq i{background:#68686A}
@keyframes mvEq{0%,100%{height:25%}50%{height:100%}}
@keyframes mvNowIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* v7.57 · apagar 72 px y botones circulares (Regresar · Inicio · Configuración) 64 px */
.top{height:72px}
.top .pwr{width:72px;height:72px}
.top .pwr svg{width:32px;height:32px}
.navc .circ{width:64px;height:64px}
.navc .circ svg{width:28px;height:28px}
.wrap{padding-top:calc(env(safe-area-inset-top) + 8px)}

/* v7.58 · apagar 96 px y botones circulares 80 px, centrados con 16 px entre cada uno */
.top{height:96px;grid-template-columns:96px 1fr 96px!important}
.top .top-sp{grid-column:1}
.top .dec{grid-column:2}
.top .pwr{grid-column:3;width:96px;height:96px}
.top .pwr svg{width:40px;height:40px}
.navrow3{display:flex!important;justify-content:center;gap:16px}
.navrow3 .navc{flex:none;width:80px}
.navc .circ{width:80px;height:80px}
.navc .circ svg{width:32px;height:32px}
.navc .lbl{white-space:nowrap}
@media (max-height:780px){.wrap{padding-bottom:calc(var(--s3) + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<div class="wrap">

  <!-- Entrada automática: el QR de la TV trae la sala; sin códigos -->
  <section class="gate" id="gate">
    <div class="logo">📺</div>
    <h1 id="gTitle">Conectando con la TV…</h1>
    <p class="muted" id="gSub"></p>
    <div class="spin" id="gSpin"></div>
    <button class="btn" id="gRetry" hidden style="max-width:280px">Reintentar</button>
  </section>

  <section id="main" hidden>
    <!-- v7.19 · configuración | decodificador (abre la lista) | encendido; D-pad, Regresar/Inicio, reproducción, volumen y apps repartidos en toda la pantalla -->
    <header class="top">
      <span class="top-sp"></span>
      <button class="dec" data-act="decoders" aria-label="Decodificadores"><b><span id="decName">Sala</span> <i>▾</i></b><small><span class="dot" id="dot"></span><span id="decState">Conectado</span></small></button>
      <button class="pwr" id="pwr" data-act="power" aria-label="Encender o apagar la TV"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button>
    </header>
    <div class="fake-note" id="fakeNote" hidden></div>

    <div data-tab="control">
      <!-- v7.21 · Regresar, Inicio y Configuración: botones circulares de 56 px justo bajo el encabezado -->
      <div class="navrow3">
        <button class="navc" data-key="BACK" aria-label="Regresar"><span class="circ gl"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7.5L4.5 12 9 16.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 12h10a4.5 4.5 0 0 1 4.5 4.5V18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="lbl">Regresar</span></button>
        <button class="navc" data-cmd="home" aria-label="Inicio"><span class="circ gl"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5M6.5 9.5V19h11V9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="lbl">Inicio</span></button>
        <button class="navc" data-act="settings" aria-label="Configuración"><span class="circ gl"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="6.6" fill="none" stroke="currentColor" stroke-width="2"/></svg></span><span class="lbl">Configuración</span></button>
      </div>
      <div class="padwrap">
        <div class="pad">
          <button class="u" data-key="UP" aria-label="Arriba"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 14.5L12 9l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="l" data-key="LEFT" aria-label="Izquierda"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6.5L9 12l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="ok" data-key="OK">OK</button>
          <button class="r" data-key="RIGHT" aria-label="Derecha"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6.5L15 12l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="d" data-key="DOWN" aria-label="Abajo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 9.5L12 15l5.5-5.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </div>
      <div class="keypad">
        <div class="apps" id="appsRow"></div>   <!-- favoritas (Configuración → Aplicaciones favoritas), justo arriba de reproducción y volumen -->
      <div class="keys3">
        <button class="gl" data-key="REW" aria-label="Retroceder 30 segundos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.5 6.5v11L3.8 12zM20.5 6.5v11L12.8 12z" fill="currentColor"/></svg></button>
        <button class="gl" data-key="PLAY" id="playBtn" aria-label="Reproducir o pausar"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-play" d="M8 5.5v13l10.5-6.5z" fill="currentColor"/><path class="i-pause" d="M7 5.5h3.6v13H7zM13.4 5.5H17v13h-3.6z" fill="currentColor"/></svg></button>
        <button class="gl" data-key="FF" aria-label="Adelantar 30 segundos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5v11l7.7-5.5zM12.5 6.5v11l7.7-5.5z" fill="currentColor"/></svg></button>
      </div>
      <div class="keys3 vol">
        <button class="gl" data-act="mute" id="muteBtn" aria-label="Silenciar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9.2h3.8L12 5.4v13.2l-4.7-3.8H3.5z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="gl" data-vol="-5" aria-label="Bajar volumen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9.2h3.8L12 5.4v13.2l-4.7-3.8H3.5z" fill="currentColor"/><path d="M15.5 9.5a3.6 3.6 0 0 1 0 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="gl" data-vol="5" aria-label="Subir volumen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9.2h3.8L12 5.4v13.2l-4.7-3.8H3.5z" fill="currentColor"/><path d="M15.5 9.5a3.6 3.6 0 0 1 0 5M18.3 6.8a7.4 7.4 0 0 1 0 10.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      </div>
    </div>

    <div data-tab="decs" hidden><div id="decsView"></div></div>
    <div data-tab="cfg" hidden><div id="cfgView"></div></div>
    <div data-tab="ahora" hidden><button class="back-ctl" data-go="control"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Control</button><div id="ahora"></div></div>
  </section>
</div>

<!-- v7.17 · sin barra de pestañas: "Ahora en la TV" se abre tocando la tarjeta "En la TV"; abajo solo queda el mini control de esa vista -->
<nav class="tabs empty" id="tabs" hidden>
  <div class="mini" id="mini" hidden>
    <button class="gl" data-key="BACK" aria-label="Regresar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7.5L4.5 12 9 16.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 12h10a4.5 4.5 0 0 1 4.5 4.5V18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Regresar</span></button>
    <button class="gl" data-key="PLAY" id="miniPlay" aria-label="Reproducir o pausar"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-play" d="M8 5.5v13l10.5-6.5z" fill="currentColor"/><path class="i-pause" d="M7 5.5h3.6v13H7zM13.4 5.5H17v13h-3.6z" fill="currentColor"/></svg></button>
    <button class="gl" data-cmd="home" aria-label="Inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5M6.5 9.5V19h11V9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Inicio</span></button>
  </div>
</div></nav>

<div class="banner" id="banner" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden></div>

<section class="game" id="game" hidden>
  <div class="gh"><div class="me" id="gMe"></div><div class="gr"><div class="pts" id="gPts">0</div><button class="gx" data-act="exitGame" aria-label="Salir del juego">✕</button></div></div>
  <p class="muted" id="gInfo" style="margin-top:6px"></p>
  <div class="gb" id="gPad">
    <button data-dir="-1" aria-label="Izquierda">◀</button>
    <button data-dir="1" aria-label="Derecha">▶</button>
  </div>
  <div class="stack" id="gOver" hidden style="margin-top:16px">
    <button class="btn" data-cmd="game">Jugar otra vez</button>
    <button class="btn ghost" data-cmd="home">Salir del juego</button>
  </div>
  <p class="hint">Mantén presionado para mover tu canasta</p>
</section>

<!-- Nave espacial: el celular se vuelve un control clásico (en vertical se dibuja girado para usarlo de lado) -->
<section class="pad2" id="pad2" hidden>
  <div class="p2-in">
    <div class="p2-top"><div class="me" id="p2Me"></div><span class="p2-info" id="p2Info"></span><span class="p2-pts" id="p2Pts">0</span><button class="p2-x" data-act="exitGame" aria-label="Salir del juego">✕</button></div>
    <div class="p2-body">
      <div class="dpad">
        <button class="du" data-d="up" aria-label="Arriba">▲</button>
        <button class="dl" data-d="left" aria-label="Izquierda">◀</button>
        <span class="dc"></span>
        <button class="dr" data-d="right" aria-label="Derecha">▶</button>
        <button class="dd" data-d="down" aria-label="Abajo">▼</button>
      </div>
      <div class="p2-mid"><div class="p2-logo">NAVE<br>ESPACIAL</div><button class="pill" data-p2="start">START</button></div>
      <div class="ab"><button class="bb" data-p2="b">B<small>escudo</small></button><button class="ba" data-p2="a">A<small>disparar</small></button></div>
    </div>
    <div class="p2-over" id="p2Over" hidden><button class="btn" data-cmd="shipStart">Jugar otra vez</button><button class="btn ghost" data-cmd="home">Salir</button></div>
  </div>
</section>

<script src="../src/services/http.js?v=7.59"></script>
<script src="../src/services/firestore-rest.js?v=7.59"></script>
<script src="content.js?v=7.59"></script>
<script src="logos.js?v=7.59"></script>
<script src="store.js?v=7.59"></script>
<script src="phone.js?v=7.59"></script>
</body>
</html>
