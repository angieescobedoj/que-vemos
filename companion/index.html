<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#140F20">
<title>Companion · Celular</title>
<style>
@font-face{font-family:'Montserrat';font-weight:400;font-display:swap;src:url('../fonts/montserrat-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Montserrat';font-weight:600;font-display:swap;src:url('../fonts/montserrat-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Montserrat';font-weight:700;font-display:swap;src:url('../fonts/montserrat-latin-700-normal.woff2') format('woff2')}
:root{--bg:#140F20;--card:#1F182E;--card-2:#2A2140;--ink:#fff;--ink-2:rgba(255,255,255,.68);--ink-3:rgba(255,255,255,.42);--line:rgba(255,255,255,.12);
  --violet:#7A4CC4;--lilac:#B9A0D6;--pink:#E58AC3;--red:#D9364F;--green:#2F9E62}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input{font:inherit}
.wrap{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:16px 16px 92px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lilac)}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
.muted{color:var(--ink-2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.btn{display:block;width:100%;background:var(--violet);color:#fff;font-weight:700;border-radius:14px;padding:14px;text-align:center}
.btn.ghost{background:var(--card-2)}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:13px;border-radius:11px}
.field{width:100%;background:var(--card-2);border:1px solid var(--line);color:#fff;border-radius:14px;padding:14px 16px;font-size:16px}
.field::placeholder{color:var(--ink-3)}

/* gate (sin códigos: el QR trae la sala) */
.gate{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:40px 10px}
.gate .logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--lilac),var(--violet));display:flex;align-items:center;justify-content:center;font-size:30px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--card-2);border-top-color:var(--lilac);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* header */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dec{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:left;min-width:0}
.dec b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dec small{display:block;font-size:12px;color:var(--ink-2)}
.dec i{margin-left:auto;font-style:normal;color:var(--ink-3)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(47,158,98,.25);flex:none}
.dot.off{background:var(--red);box-shadow:0 0 0 4px rgba(217,54,79,.25)}
.dot.sleep{background:#E0A93A;box-shadow:0 0 0 4px rgba(224,169,58,.25)}
.pwr{width:52px;height:52px;border-radius:50%;background:var(--red);color:#fff;font-size:22px;font-weight:700;flex:none;display:flex;align-items:center;justify-content:center}
.pwr.sleep{background:var(--card-2);color:var(--green);border:1px solid var(--line)}
.now{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.now .thumb{width:50px;height:50px;border-radius:14px;flex:none}
.now .k{font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.1em}
.now .t{font-weight:700}
.now .s{font-size:12px;color:var(--ink-2)}
.fake-note{background:rgba(224,169,58,.14);border:1px solid rgba(224,169,58,.4);color:#F3D59A;border-radius:14px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}

/* control */
.search{display:flex;gap:8px;margin-bottom:18px}
.pad{position:relative;width:250px;height:250px;margin:12px auto 16px;border-radius:50%;background:var(--card);border:1px solid var(--line)}
.pad button{position:absolute;width:80px;height:80px;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--ink-2);border-radius:50%}
.pad button:active{background:var(--card-2);color:#fff}
.pad .u{left:85px;top:0}.pad .d{left:85px;bottom:0}.pad .l{left:0;top:85px}.pad .r{right:0;top:85px}
.pad .ok{left:75px;top:75px;width:100px;height:100px;background:var(--violet);color:#fff;font-size:16px;font-weight:700}
.pad .ok:active{background:#8E5FD8}
.quick{display:grid;grid-template-columns:1fr 1.45fr 1fr;gap:8px;margin-bottom:6px}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 4px;font-size:12.5px;white-space:nowrap;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.quick button.voice{background:var(--violet);border-color:var(--violet)}
.quick i{font-style:normal;font-size:17px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.keys3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.row2 button,.vol button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 6px;font-size:13px;font-weight:700}
.row2 button:active,.vol button:active,.quick button:active,.apps button:active,.more button:active{transform:scale(.97)}
.vol{display:grid;grid-template-columns:1fr 1fr 1.1fr 1fr;gap:10px;align-items:center;margin-bottom:6px}
.vol button{padding:11px 6px;color:#fff;display:flex;align-items:center;justify-content:center}
.vol span{text-align:center;font-size:13px;font-weight:700;color:var(--ink-2)}
.vol button.on{background:var(--red);border-color:var(--red);color:#fff}
.keys3 svg,.vol svg{width:24px;height:24px;display:block;color:#fff}
#playBtn .i-pause{display:none}
#playBtn.playing .i-play{display:none}
#playBtn.playing .i-pause{display:inline}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.apps button{aspect-ratio:1/1;border-radius:14px;position:relative;overflow:hidden;background:var(--c,#15111F);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;padding:4px;font-size:12px;font-weight:700;line-height:1.15;text-align:center}
.apps button img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.apps button.has-logo{background:#000}
.apps button.has-logo .nm{visibility:hidden}
.apps .live-tile{background:linear-gradient(160deg,#2B57C9 0%,#13285E 100%)}
.apps .live-tile small{display:block;font-size:10px;font-weight:600;opacity:.8}
.apps .live-tile .nm{font-size:14px}
.more{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.more button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 4px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:5px}
.more i{font-style:normal;font-size:20px}
.sec-c{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 8px}
.keys3 button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 6px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
.keys3 button:active{background:var(--card-2)}

/* ahora */
.sec{margin-top:18px}
.sec-h{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .av{width:40px;height:40px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--lilac),var(--violet));display:flex;align-items:center;justify-content:center;font-weight:700}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600}
.item .s{font-size:12px;color:var(--ink-2)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin:12px 0}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink-2)}
.seg button.on{background:var(--violet);color:#fff}
.lineup{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lineup .team{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.lineup .tn{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px}
.lineup .sw{width:12px;height:12px;border-radius:3px}
.lineup .pl{display:flex;gap:8px;font-size:12.5px;padding:3px 0}
.lineup .pl b{width:20px;color:var(--lilac)}
.lineup .pl span{flex:1}
.lineup .pl em{font-style:normal;color:var(--ink-3);font-size:10.5px}
.stat{margin:12px 0}
.stat .row{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
.stat .bars{display:flex;gap:4px;height:8px}
.stat .bars i{display:block;border-radius:4px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px;font-size:14px}
.empty{text-align:center;padding:30px 10px}
.empty p{margin:8px 0 18px}
.stack{display:flex;flex-direction:column;gap:10px}
.prog{height:6px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;background:var(--lilac)}
.series-card{border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.series-card .art{height:150px;position:relative}
.series-card .art span{position:absolute;left:16px;bottom:12px;font-size:22px;font-weight:700}
.series-card .body{background:var(--card);padding:16px}

/* banner */
.banner{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));max-width:436px;margin:0 auto;background:#fff;color:#1E1A1A;border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center;z-index:30;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.banner .ic{width:42px;height:42px;border-radius:12px;background:var(--violet);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.banner .k{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--violet)}
.banner .t{font-weight:700;font-size:14px}
.banner .s{font-size:12px;color:#555}
.banner .x{margin-left:auto;display:flex;flex-direction:column;gap:6px}
.banner .x button{font-size:12px;font-weight:700;border-radius:10px;padding:7px 10px;background:var(--violet);color:#fff}
.banner .x button.g{background:#EFE8F7;color:var(--violet)}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;color:#1E1A1A;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));z-index:40;max-width:460px;margin:0 auto;box-shadow:0 -12px 40px rgba(0,0,0,.4)}
.sheet .img{height:140px;border-radius:16px;background:linear-gradient(135deg,#C792C9,#4A2E7A);margin-bottom:14px}
.sheet h2{margin-bottom:4px}
.sheet .sub{color:#666;font-size:13.5px;margin-bottom:14px}
.sheet .btn.ghost{background:#EFE8F7;color:var(--violet)}
.sheet{max-height:86vh;overflow:auto}
.sheet .x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;background:#F1EDF6;color:#555;font-size:16px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:14px;border:1px solid #ECE6F3;margin-bottom:8px;background:#fff;color:#1E1A1A}
.opt.on{border-color:var(--violet);background:#F6F1FC}
.opt .ic{width:40px;height:40px;border-radius:12px;background:#F1EDF6;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.opt .grow{flex:1;min-width:0}
.opt .t{font-weight:700}
.opt .s{font-size:12px;color:#777}
.opt .tag{font-size:10.5px;font-weight:700;color:#A0712A;background:#FBF0DC;border-radius:6px;padding:2px 6px;margin-left:6px}
.opt .del{color:#999;font-size:14px;padding:6px}
.sdot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--green)}
.sdot.sleep{background:#E0A93A}.sdot.off{background:#BBB}
.lf{display:block;font-size:12.5px;font-weight:700;color:#555;margin:12px 0 6px}
.lf input[type=range]{width:100%;accent-color:var(--violet)}
.in-l{width:100%;border:1px solid #DDD3EA;border-radius:12px;padding:12px 14px;font-size:16px;color:#1E1A1A;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chips button{background:#F1EDF6;color:#4A2E7A;font-size:13px;font-weight:600;border-radius:999px;padding:8px 12px}
.chips button.on{background:var(--violet);color:#fff}
.mic{width:96px;height:96px;border-radius:50%;background:var(--violet);color:#fff;font-size:38px;display:flex;align-items:center;justify-content:center;margin:8px auto 10px}
.mic.on{background:var(--red);animation:pl 1s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.07)}}
.vtext{text-align:center;font-weight:700;font-size:17px;min-height:24px}
.vreply{text-align:center;color:#666;font-size:13.5px;min-height:20px;margin-top:4px}
.vform{display:flex;gap:8px}
.vform button{background:var(--violet);color:#fff;font-weight:700;border-radius:12px;padding:0 16px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:48px;height:48px;border-radius:12px;background:#F1EDF6;color:#4A2E7A;font-size:22px;font-weight:700;flex:none}
.stepper input{flex:1;min-width:0;text-align:center;font-size:22px;font-weight:700;border:1px solid #DDD3EA;border-radius:12px;padding:9px;color:#1E1A1A}
.stepper span{font-weight:700;color:#555}
/* control por voz: pantalla completa oscura con onda neón (imagen de referencia) */
.sheet.voice{top:0;border-radius:0;max-height:none;height:100%;color:#fff;display:flex;flex-direction:column;align-items:stretch;padding:calc(12px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));
  background:radial-gradient(70% 38% at 50% 26%,rgba(150,60,230,.32) 0%,rgba(150,60,230,0) 70%),radial-gradient(90% 40% at 50% 100%,rgba(120,50,200,.28) 0%,rgba(120,50,200,0) 70%),linear-gradient(180deg,#140A24 0%,#0B0614 100%);box-shadow:none}
.vhead{display:flex;align-items:center;justify-content:space-between;height:48px}
.vhead h2{font-size:18px;margin:0}
.vhead button{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#fff}
.vhead svg{width:24px;height:24px}
.vwave{display:flex;align-items:center;justify-content:center;gap:7px;height:150px;margin:22px 0 8px}
.vline{flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(190,110,255,0),#C07CFF);box-shadow:0 0 8px #A855F7}
.vline:last-child{background:linear-gradient(270deg,rgba(190,110,255,0),#C07CFF)}
.vbar{width:11px;border-radius:999px;border:2px solid #D7A8FF;box-shadow:0 0 10px #A855F7,0 0 22px rgba(168,85,247,.7),inset 0 0 6px rgba(168,85,247,.6);transform:scaleY(.8);animation:vbreath 2.4s ease-in-out infinite}
.vbar:nth-child(5),.vbar:nth-child(6),.vbar:nth-child(7),.vbar:nth-child(8),.vbar:nth-child(9){background:linear-gradient(180deg,#E9CCFF,#B266FF);border-color:#F1DDFF}
.vwave.on .vbar{animation:vtalk .9s ease-in-out infinite}
@keyframes vbreath{0%,100%{transform:scaleY(.8)}50%{transform:scaleY(.92)}}
@keyframes vtalk{0%,100%{transform:scaleY(.5)}30%{transform:scaleY(1.05)}60%{transform:scaleY(.75)}}
.sheet.voice .vtext{font-size:26px;font-weight:700;margin:14px 0 4px;min-height:34px;text-align:center;overflow-wrap:anywhere}
.sheet.voice .vreply{color:#CDB6EA;font-size:14px;min-height:20px;margin:0 0 18px}
.vsugs{display:flex;flex-direction:column;gap:12px}
.vsug{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px 18px;font-size:16px;font-weight:600;color:#fff}
.vsug svg{width:26px;height:26px;color:#C07CFF;flex:none}
.vsug:active{background:rgba(168,85,247,.22)}
.vfoot{margin-top:auto;padding-top:22px;display:flex;flex-direction:column;align-items:center;gap:12px}
.vmic{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;
  background:radial-gradient(circle,#3A1660 0%,#200C38 70%);border:2px solid #B266FF;box-shadow:0 0 0 7px rgba(168,85,247,.16),0 0 26px rgba(168,85,247,.55)}
.vmic svg{width:38px;height:38px}
.vmic.on{animation:vglow 1.3s ease-in-out infinite}
@keyframes vglow{50%{box-shadow:0 0 0 13px rgba(168,85,247,.22),0 0 40px rgba(168,85,247,.85)}}
.sheet.voice .vform{width:100%}
.vtype{color:#CDB6EA;font-size:13px;font-weight:600;text-decoration:underline}
.scrim{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:35}

/* gamepad */
.game{position:fixed;left:0;top:0;right:0;bottom:0;background:var(--bg);z-index:25;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none}
.game .gh{display:flex;justify-content:space-between;align-items:center}
.game .me{display:flex;align-items:center;gap:10px;font-weight:700}
.game .me .av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.game .pts{font-size:34px;font-weight:700}
.game .gr{display:flex;align-items:center;gap:14px}
.game .gx{width:44px;height:44px;border-radius:50%;background:var(--card-2);border:1px solid var(--line);font-size:18px;color:#fff}
.game .gb{flex:1;display:flex;gap:14px;margin-top:16px}
.game .gb button{flex:1;border-radius:28px;background:var(--card);border:1px solid var(--line);font-size:56px;color:var(--lilac);touch-action:none}
.game .gb button.on{background:var(--violet);color:#fff}
.game .hint{text-align:center;font-size:12px;color:var(--ink-3);margin-top:10px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#fff;color:#1E1A1A;font-weight:600;font-size:13px;padding:10px 16px;border-radius:12px;z-index:45;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.3)}
/* Feedback al presionar, igual en iPhone y Android: iOS no pinta :active por sí solo, así que phone.js pone .pressed
   en cuanto el dedo toca el botón y lo deja al menos 140 ms para que se alcance a ver aunque el toque sea rapidísimo. */
button{transition:background-color .08s,transform .08s,filter .08s}
button.pressed{transform:scale(.95);filter:brightness(1.4)}
.quick button.pressed,.row2 button.pressed,.keys3 button.pressed,.vol button.pressed,.more button.pressed,.apps button.pressed,.dec.pressed,.tab.pressed{background:#3D3060;border-color:rgba(185,160,214,.7);filter:none}
.quick button.voice.pressed{background:#9D6FE6;border-color:#9D6FE6}
.pad button.pressed{background:var(--card-2);color:#fff;filter:none;transform:none}
.pad .ok.pressed{background:#9D6FE6;transform:scale(.96)}
.sheet button.pressed,.banner button.pressed{filter:brightness(.88)}
.sheet:not([hidden]) ~ .toast{bottom:auto;top:calc(14px + env(safe-area-inset-top))}
/* sugerencia al pausar (banner con póster) */
.banner.offer{flex-wrap:wrap;align-items:flex-start}
.banner.offer .poster{width:54px;height:80px;border-radius:10px;flex:none;background:#EEE center/cover no-repeat}
.banner.offer .grow{flex:1;min-width:0}
.banner.offer .t{font-size:15px;line-height:1.25;margin:2px 0}
.banner.offer .row{display:flex;gap:8px;width:100%}
.banner.offer .row button{flex:1;font-size:13px;font-weight:700;border-radius:12px;padding:11px 8px;background:var(--violet);color:#fff}
.banner.offer .row button.g{flex:0 0 auto;background:#EFE8F7;color:var(--violet)}
/* datos curiosos */
.fact{position:relative;background:#F6F1FC;border-radius:16px;padding:18px 16px 18px;font-size:17px;font-weight:600;line-height:1.4;color:#2A1E40;min-height:120px}
.fact .fn{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;color:#7A4CC4;margin-bottom:6px}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0 4px}
.dots i{width:8px;height:8px;border-radius:50%;background:#DDD3EA}.dots i.on{background:#7A4CC4}
/* control clásico */
.pad2{position:fixed;left:0;top:0;right:0;bottom:0;z-index:38;background:#120E1C;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.p2-in{position:absolute;left:0;top:0;width:100vw;height:100vh;display:flex;flex-direction:column;padding:10px max(22px,env(safe-area-inset-right)) 10px max(22px,env(safe-area-inset-left));transform-origin:top left;box-sizing:border-box}
.p2-in.rot{padding:12px 30px 12px 54px}
.p2-top{display:flex;align-items:center;gap:12px}
.p2-top .me{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.p2-top .av{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.p2-info{flex:1;text-align:center;font-size:13px;color:var(--ink-2)}
.p2-pts{font-size:22px;font-weight:700;min-width:36px;text-align:right}
.p2-x{width:36px;height:36px;border-radius:50%;background:var(--card-2);border:1px solid var(--line);color:#fff}
.p2-body{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:0}
.dpad{position:relative;width:min(42vmin,180px);height:min(42vmin,180px);flex:none}
.dpad button,.dpad .dc{position:absolute;width:34%;height:34%;background:#2B2340;border:1px solid #3B3155;color:#B9A0D6;font-size:20px;display:flex;align-items:center;justify-content:center}
.dpad .du{left:33%;top:0;border-radius:12px 12px 0 0}.dpad .dd{left:33%;bottom:0;border-radius:0 0 12px 12px}
.dpad .dl{left:0;top:33%;border-radius:12px 0 0 12px}.dpad .dr{right:0;top:33%;border-radius:0 12px 12px 0}
.dpad .dc{left:33%;top:33%;border:0}
.dpad button.on{background:#7A4CC4;color:#fff}
.p2-mid{display:flex;flex-direction:column;align-items:center;gap:14px}
.p2-logo{font-size:12px;font-weight:700;letter-spacing:.2em;text-align:center;color:var(--ink-3)}
.pill{background:#2B2340;border:1px solid #3B3155;color:#B9A0D6;font-size:11px;font-weight:700;letter-spacing:.14em;border-radius:999px;padding:8px 18px}
.pill.on{background:#7A4CC4;color:#fff}
.ab{position:relative;width:min(44vmin,190px);height:min(38vmin,160px);flex:none}
.ab button{position:absolute;width:46%;height:54%;border-radius:50%;font-size:26px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ab small{font-size:9px;font-weight:600;letter-spacing:.06em;margin-top:3px;opacity:.85}
.ab .ba{right:0;top:0;background:#D9364F;color:#fff}
.ab .bb{left:0;bottom:0;background:#E0A93A;color:#1E1A1A}
.ab button.on{transform:scale(.92);filter:brightness(1.25)}
.p2-over{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(18,14,28,.9);display:flex;align-items:center;justify-content:center;gap:12px;padding:0 20%}
.p2-over .btn{flex:1}
.qty{display:flex;align-items:center;gap:8px;flex:none}
.qty button{width:32px;height:32px;border-radius:10px;background:#F1EDF6;color:#4A2E7A;font-size:18px;font-weight:700}
.qty b{min-width:14px;text-align:center}
.chipb{flex:none;background:#F1EDF6;color:#4A2E7A;font-size:12.5px;font-weight:700;border-radius:999px;padding:8px 12px}
.chipb.on{background:var(--violet);color:#fff}
.pairb{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.banner .x a.lk{font-size:12px;font-weight:700;border-radius:10px;padding:7px 10px;background:#1E1A1A;color:#fff;text-align:center;text-decoration:none}
.card a.btn.sm{text-decoration:none;margin-right:6px}
.songbtns{display:flex;gap:8px;padding:0 0 12px}
.songbtns .btn{flex:1;text-align:center}
.nowtv{display:block;font-size:11px;font-weight:700;color:#1F6B43;margin-bottom:2px}
.nowbtn{flex:none;margin-left:auto;background:var(--violet);color:#fff;font-size:12.5px;font-weight:700;border-radius:999px;padding:9px 12px}
.now .grow{flex:1;min-width:0}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#F1EDF6;border-radius:12px;padding:4px;margin-bottom:12px}
.seg2 button{border-radius:9px;padding:9px;font-size:13.5px;font-weight:700;color:#6A5A80}
.seg2 button.on{background:#fff;color:#4A2E7A;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.opt.ing{padding:9px 12px}
.opt .ck2{width:22px;height:22px;border-radius:7px;border:2px solid #CFC4DE;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
.opt.ing.on .ck2{background:var(--violet);border-color:var(--violet)}
.opt.ing:not(.on) .t,.opt.ing:not(.on) .pr{color:#AAA;text-decoration:line-through}
.opt .pr{flex:none;font-size:14px}
.stores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stores button{background:#F6F1FC;border:2px solid transparent;border-radius:12px;padding:9px 6px;text-align:center;color:#2A1E40}
.stores button b{display:block;font-size:12.5px}
.stores small{display:block;font-size:11px;color:#777;margin-top:2px}
.stores button.on{border-color:var(--violet);background:#fff}
.toast.err{background:var(--red);color:#fff}
</style>
</head>
<body>
<div class="wrap">

  <!-- Entrada automática: el QR de la TV trae la sala; sin códigos -->
  <section class="gate" id="gate">
    <div class="logo">📺</div>
    <h1 id="gTitle">Conectando con la TV…</h1>
    <p class="muted" id="gSub"></p>
    <div class="spin" id="gSpin"></div>
    <button class="btn" id="gRetry" hidden style="max-width:280px">Reintentar</button>
  </section>

  <section id="main" hidden>
    <header class="top">
      <button class="dec" data-act="decoders"><span class="dot" id="dot"></span><span style="min-width:0"><b id="decName">Sala</b><small id="decState">Conectado</small></span><i>▾</i></button>
      <button class="pwr" id="pwr" data-act="power" aria-label="Encender o apagar la TV"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button>
    </header>
    <div class="fake-note" id="fakeNote" hidden></div>
    <div class="now" id="now"></div>

    <div data-tab="control">
      <div class="quick">
        <button data-act="search"><i>🔍</i>Buscar</button>
        <button class="voice" data-act="voice"><i>🎤</i>Control por voz</button>
        <button data-cmd="menu"><i>☰</i>Menú</button>
      </div>
      <div class="pad">
        <button class="u" data-key="UP" aria-label="Arriba">▲</button>
        <button class="l" data-key="LEFT" aria-label="Izquierda">◀</button>
        <button class="ok" data-key="OK">OK</button>
        <button class="r" data-key="RIGHT" aria-label="Derecha">▶</button>
        <button class="d" data-key="DOWN" aria-label="Abajo">▼</button>
      </div>
      <div class="row2">
        <button data-key="BACK">↩  Regresar</button>
        <button data-cmd="home">⌂  Inicio</button>
      </div>
      <!-- Iconos SVG en blanco (currentColor): se ven igual en iOS y Android, a diferencia de los emojis -->
      <div class="keys3">
        <button data-key="REW" aria-label="Retroceder 30 segundos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.5 6.5v11L3.8 12zM20.5 6.5v11L12.8 12z" fill="currentColor"/></svg></button>
        <button data-key="PLAY" id="playBtn" aria-label="Reproducir o pausar"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-play" d="M8 5.5v13l10.5-6.5z" fill="currentColor"/><path class="i-pause" d="M7 5.5h3.6v13H7zM13.4 5.5H17v13h-3.6z" fill="currentColor"/></svg></button>
        <button data-key="FF" aria-label="Adelantar 30 segundos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5v11l7.7-5.5zM12.5 6.5v11l7.7-5.5z" fill="currentColor"/></svg></button>
      </div>
      <div class="vol">
        <button data-act="mute" id="muteBtn" aria-label="Silenciar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9.2h3.8L12 5.4v13.2l-4.7-3.8H3.5z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button data-vol="-5" aria-label="Bajar volumen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9.2h3.8L12 5.4v13.2l-4.7-3.8H3.5z" fill="currentColor"/><path d="M15.5 9.5a3.6 3.6 0 0 1 0 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <span id="volLbl">Vol 30</span>
        <button data-vol="5" aria-label="Subir volumen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9.2h3.8L12 5.4v13.2l-4.7-3.8H3.5z" fill="currentColor"/><path d="M15.5 9.5a3.6 3.6 0 0 1 0 5M18.3 6.8a7.4 7.4 0 0 1 0 10.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
      <p class="sec-c">Mis apps</p>
      <!-- Como en "Mis apps" de la TV: cada tarjeta es el logo de la app. Si el logo no carga, queda el nombre sobre el color de la marca. -->
      <div class="apps">
        <button data-open="tv" class="live-tile" aria-label="TV en vivo"><span class="nm"><small>TV</small>en vivo</span></button>
        <button data-app="netflix" style="--c:#E50914" aria-label="Netflix"><span class="nm">Netflix</span></button>
        <button data-app="prime" style="--c:#1A98FF" aria-label="Prime Video"><span class="nm">Prime Video</span></button>
        <button data-app="youtube" style="--c:#FF0033" aria-label="YouTube"><span class="nm">YouTube</span></button>
      </div>
      <p class="sec-c">Más</p>
      <div class="more">
        <button data-act="exps"><i>✨</i>Experiencias</button>
        <button data-act="find"><i>📍</i>Encontrar control</button>
      </div>
    </div>

    <div data-tab="ahora" hidden><div id="ahora"></div></div>
    <div data-tab="seguir" hidden><div id="seguir"></div></div>
  </section>
</div>

<nav class="tabs" id="tabs" hidden><div class="in">
  <button class="tab on" data-go="control"><i>🎮</i>Control</button>
  <button class="tab" data-go="ahora"><i>✨</i>Ahora en la TV</button>
  <button class="tab" data-go="seguir"><i>⏵</i>Seguir viendo</button>
</div></nav>

<div class="banner" id="banner" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden></div>

<section class="game" id="game" hidden>
  <div class="gh"><div class="me" id="gMe"></div><div class="gr"><div class="pts" id="gPts">0</div><button class="gx" data-act="exitGame" aria-label="Salir del juego">✕</button></div></div>
  <p class="muted" id="gInfo" style="margin-top:6px"></p>
  <div class="gb" id="gPad">
    <button data-dir="-1" aria-label="Izquierda">◀</button>
    <button data-dir="1" aria-label="Derecha">▶</button>
  </div>
  <div class="stack" id="gOver" hidden style="margin-top:16px">
    <button class="btn" data-cmd="game">Jugar otra vez</button>
    <button class="btn ghost" data-cmd="home">Salir del juego</button>
  </div>
  <p class="hint">Mantén presionado para mover tu canasta</p>
</section>

<!-- Nave espacial: el celular se vuelve un control clásico (en vertical se dibuja girado para usarlo de lado) -->
<section class="pad2" id="pad2" hidden>
  <div class="p2-in">
    <div class="p2-top"><div class="me" id="p2Me"></div><span class="p2-info" id="p2Info"></span><span class="p2-pts" id="p2Pts">0</span><button class="p2-x" data-act="exitGame" aria-label="Salir del juego">✕</button></div>
    <div class="p2-body">
      <div class="dpad">
        <button class="du" data-d="up" aria-label="Arriba">▲</button>
        <button class="dl" data-d="left" aria-label="Izquierda">◀</button>
        <span class="dc"></span>
        <button class="dr" data-d="right" aria-label="Derecha">▶</button>
        <button class="dd" data-d="down" aria-label="Abajo">▼</button>
      </div>
      <div class="p2-mid"><div class="p2-logo">NAVE<br>ESPACIAL</div><button class="pill" data-p2="start">START</button></div>
      <div class="ab"><button class="bb" data-p2="b">B<small>escudo</small></button><button class="ba" data-p2="a">A<small>disparar</small></button></div>
    </div>
    <div class="p2-over" id="p2Over" hidden><button class="btn" data-cmd="shipStart">Jugar otra vez</button><button class="btn ghost" data-cmd="home">Salir</button></div>
  </div>
</section>

<script src="../src/services/http.js?v=7.5"></script>
<script src="../src/services/firestore-rest.js?v=7.5"></script>
<script src="content.js?v=7.5"></script>
<script src="logos.js?v=7.5"></script>
<script src="store.js?v=7.5"></script>
<script src="phone.js?v=7.5"></script>
</body>
</html>
